apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qvs-application-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - verify.qvs.internal
      secretName: qvs-tls-secret
  rules:
    - host: verify.qvs.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qvs-application-service
                port:
                  number: 80
