apiVersion: apps/v1
kind: Deployment
metadata:
  name: qvs-application-deployment
  namespace: default
  labels:
    app: qvs-backend
    tier: application
spec:
  replicas: 3
  selector:
    matchLabels:
      app: qvs-backend
  template:
    metadata:
      labels:
        app: qvs-backend
    spec:
      containers:
        - name: qvs-server
          image: devops-qvs:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://qvs-postgres-service:5432/qvsdb"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: qvs-db-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qvs-db-secret
                  key: password
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
